name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'web/**'
      - 'tools/**'
      - 'android-app/**'
      - 'package*.json'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - run: npm ci

      - name: Run tests
        run: npm run test:release8 && npm run test:state

      - run: npm run prepare:android

      - run: npm ci
        working-directory: android-app

      - run: npx cordova platform add android@14.0.1 --no-telemetry
        working-directory: android-app

      - name: Build test APK
        run: npx cordova build android --debug --no-telemetry -- --packageType=apk
        working-directory: android-app

      - uses: actions/upload-artifact@v4
        with:
          name: Perekup-0.11-test-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build store APK when signing secrets are configured
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$SIGNING_KEY" ]; then
            echo 'Test APK built. Store signing secrets are not configured.'
            exit 0
          fi

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Missing required signing secrets.'
            exit 1
          fi

          trap 'rm -f release.jks build-signing.json' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.jks

          node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('build-signing.json', JSON.stringify({
            android: {
              release: {
                keystore: 'release.jks',
                storePassword: process.env.STORE_PASSWORD,
                alias: process.env.KEY_ALIAS,
                password: process.env.KEY_PASSWORD,
                packageType: 'apk'
              }
            }
          }));
          NODE

          npx cordova build android --release --no-telemetry --buildConfig=build-signing.json -- --packageType=apk

      - uses: actions/upload-artifact@v4
        with:
          name: Perekup-0.11-store-APK
          path: android-app/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
