name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['game/**', 'web/**', 'tools/**', 'android-app/**', 'package*.json', 'index.html', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android-app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: npm ci
      - run: npm run test:release8 && npm run test:state
      - run: npm run prepare:android
      - run: npm ci
        working-directory: android-app
      - run: npx cordova platform add android@14.0.1 --no-telemetry
        working-directory: android-app
      - run: npx cordova build android --debug --no-telemetry -- --packageType=apk
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        with:
          name: Perekup-0.10-test-APK
          path: android-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # A store release must use the developer's permanent private signing key.
      # No signing key is generated or uploaded as a public artifact.
      - name: Build store APK when signing secrets are configured
        env:
          SIGNING_KEY: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo 'Test APK built. Store signing secrets are not configured.'
            exit 0
          fi
          trap 'rm -f release.jks build-signing.json' EXIT
          printf '%s' "$SIGNING_KEY" | base64 --decode > release.jks
          node -e 'require("fs").writeFileSync("build-signing.json",JSON.stringify({android:{release:{keystore:"release.jks",storePassword:process.env.STORE_PASSWORD,alias:process.env.KEY_ALIAS,password:process.env.KEY_PASSWORD,packageType:"apk"}}}))'
          npx cordova build android --release --no-telemetry --buildConfig=build-signing.json
      - uses: actions/upload-artifact@v4
        with:
          name: Perekup-0.10-store-APK
          path: android-app/platforms/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
