<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>С рук — телефон и Azon</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#182537;color:#eaf0fb;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:28px 14px}main{width:min(100%,460px)}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5}small,.muted{color:#758398}.intro{color:#b8c8de;font-size:14px}.phone{background:#f3f6fc;border:8px solid #34455c;border-radius:40px;overflow:hidden;box-shadow:0 25px 80px #0005;color:#17243c}.status{padding:16px 22px 10px;background:#fff;display:flex;justify-content:space-between;font-size:13px;font-weight:700}.content{min-height:580px;max-height:760px;overflow-y:auto}.header{background:#1358e8;color:#fff;padding:22px}.header h2{margin:0;font-size:39px;letter-spacing:-1.5px}.header p{margin:4px 0 0;font-size:12px;letter-spacing:1px}.pad{padding:18px}.home{background:linear-gradient(150deg,#162a4a,#365778);color:white;min-height:580px;padding:28px 22px}.home h2{font-size:29px;margin:24px 0 32px}.apps{display:flex;gap:24px}.app{background:none;border:0;color:white;padding:0;font-size:14px;cursor:pointer}.app span{display:grid;place-items:center;width:76px;height:76px;border-radius:23px;background:#1358e8;font-size:32px;font-weight:800;margin-bottom:8px}.app:nth-child(2) span{background:#315ae8}.app:nth-child(3) span{background:#e9a451}.panel{background:#ffffff14;border-radius:20px;padding:18px;margin-top:32px}.info{background:#e1eafe;border-radius:16px;padding:14px;color:#2157b6;font-size:14px}.search{width:100%;background:white;border:1px solid #e2e8f3;border-radius:15px;padding:15px;font:inherit;margin-bottom:14px}.card{background:white;border-radius:19px;padding:15px;margin-top:13px;display:flex;gap:14px;align-items:center}.icon{background:#edf2fa;border-radius:14px;width:64px;height:72px;flex:none;display:grid;place-items:center;color:#1358e8;font-size:30px;font-weight:700}.detail{flex:1}.detail h3{font-size:15px;margin:0 0 6px}.price{font-size:18px;font-weight:750;margin-bottom:5px}.note{font-size:12px;color:#74819b;line-height:1.5}.button,button{font:inherit}.button{border:0;background:#1358e8;color:white;border-radius:13px;padding:12px 15px;cursor:pointer}.button:disabled{background:#e7ecf3;color:#8995a9;cursor:default}.add{font-size:24px;padding:4px 13px}.wide{width:100%;margin-top:16px}.secondary{background:#e4ebfa;color:#2857bb}.warning{background:#fff0de;color:#985b22;padding:15px;border-radius:16px;font-size:13px;margin-top:16px;line-height:1.5}.nav{display:flex;border-top:1px solid #e2e8f3;background:white;padding:12px;gap:8px}.nav button{flex:1;border:0;background:#eff3fa;color:#355270;border-radius:12px;padding:10px 3px;font-size:12px;cursor:pointer}.gesture{height:4px;width:120px;background:#243248;border-radius:9px;margin:8px auto 12px}.message{border-radius:12px;background:#e1f2e9;color:#286144;padding:12px 15px;margin:12px 18px;font-size:13px}.outside{display:flex;gap:9px;margin-top:16px}.outside button{flex:1;border:1px solid #52647b;border-radius:12px;background:#26394f;color:#eaf0fb;padding:12px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f6aa5a;outline-offset:3px}.empty{padding:30px 0;color:#74819b;text-align:center}.balance{display:flex;justify-content:space-between;padding:12px 18px;font-size:13px;background:#eef2f9}.qty{display:flex;align-items:center;gap:8px}.qty button{border:0;background:#e9eef8;border-radius:8px;padding:5px 11px;color:#315ae8;font-weight:bold;cursor:pointer}
</style>
<main><h1>С рук · прототип телефона</h1><p class="intro">Проверь покупку деталей и получение посылок. Это локальная демонстрация: заказов и платежей в реальных магазинах нет.</p><div class="phone"><div class="status"><span>9:41</span><span>● ● ● ▰</span></div><div id="balance" class="balance"></div><div id="content" class="content"></div><div id="message" role="status" aria-live="polite"></div><div class="nav"><button data-action="home">Домой</button><button data-action="catalog">Azon</button><button data-action="orders">Посылки</button><button data-action="inventory">Детали</button></div><div class="gesture"></div></div><div class="outside"><button data-action="sleep">Сон · +1 игровой день</button><button data-action="reset">Начать заново</button></div><p class="intro">Каталог ограничен. Если нужной детали нет, ищи другой источник — «Авиту», мастера или телефон-донор.</p></main>
<script>
const products=[
 {id:'battery',name:'Аккумулятор R / 01',price:720,stock:2,days:1,icon:'▣'},
 {id:'tape',name:'Клейкая лента',price:180,stock:6,days:1,icon:'◉'},
 {id:'screen',name:'Дисплей R / 01',price:2100,stock:0,days:2,icon:'▯'},
 {id:'flex',name:'Шлейф зарядки',price:390,stock:1,days:3,icon:'⌁'},
 {id:'driver',name:'Отвёртка PH000',price:490,stock:2,days:2,icon:'╂'}];
const fresh=()=>({version:1,day:3,money:5000,stock:Object.fromEntries(products.map(p=>[p.id,p.stock])),cart:{},orders:[],inventory:{},serial:1});
let state=fresh(),page='home',notice='',query='';
try{const saved=JSON.parse(localStorage.getItem('s_ruk_azon_v1'));if(saved&&saved.version===1)state=saved}catch{}
const rub=n=>n.toLocaleString('ru-RU')+' ₽';
function save(){try{localStorage.setItem('s_ruk_azon_v1',JSON.stringify(state))}catch{}}
function total(){return products.reduce((s,p)=>s+p.price*(state.cart[p.id]||0),0)}
function cartCount(){return Object.values(state.cart).reduce((a,b)=>a+b,0)}
function card(p){const n=state.stock[p.id];return `<article class="card"><div class="icon">${p.icon}</div><div class="detail"><h3>${p.name}</h3><div class="price">${rub(p.price)}</div><div class="note">${n?`${n} шт. · ${p.days===1?'завтра':'через '+p.days+' дня'}`:'Нет в наличии'}</div></div><button class="button add" data-action="add" data-id="${p.id}" aria-label="Добавить: ${p.name}" ${!n||((state.cart[p.id]||0)>=n)?'disabled':''}>+</button></article>`}
function header(title='azon',sub='ДЕТАЛИ ДЛЯ ТВОИХ СДЕЛОК'){return `<div class="header"><h2>${title}</h2><p>${sub}</p></div>`}
function render(){
 document.getElementById('balance').innerHTML=`<span>День ${state.day}</span><strong>${rub(state.money)}</strong>`;
 let h='';
 if(page==='home'){
  const ready=state.orders.filter(o=>!o.picked&&o.ready<=state.day).length;
  h=`<div class="home"><small style="color:#c5d5ea">Моя мастерская</small><h2>Хороший день<br>для новой сделки.</h2><div class="apps"><button class="app" data-action="catalog"><span>az</span>Azon</button><button class="app" data-action="avitu"><span>а</span>Авиту</button><button class="app" data-action="inventory"><span>▣</span>Детали</button></div><div class="panel"><b>Посылки</b><p>${ready?`${ready} готово к выдаче`:'Готовых посылок пока нет'}</p><button class="button" data-action="orders">Проверить заказы</button></div></div>`;
 }else if(page==='catalog'){
  h=header()+`<div class="pad"><input class="search" id="search" placeholder="Поиск по модели или детали" aria-label="Поиск деталей"><div class="info"><b>Пункт выдачи: у «Пятака»</b><br>Доставка 1–3 игровых дня</div><div id="products">${products.filter(p=>p.name.toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p class="empty">Такой детали в каталоге нет.</p>'}</div><div class="warning"><b>Не всё можно заказать.</b><br>Дисплея сейчас нет. За донором отправляйся в «Авиту» или к местному мастеру.</div><button class="button wide" data-action="cart">Корзина · ${cartCount()} шт. · ${rub(total())}</button></div>`;
 }else if(page==='cart'){
  h=header('Корзина','ПРОВЕРЬ ДЕТАЛИ ПЕРЕД ЗАКАЗОМ')+'<div class="pad">';
  for(const p of products){const q=state.cart[p.id]||0;if(!q)continue;h+=`<article class="card"><div class="detail"><h3>${p.name}</h3><div class="price">${rub(q*p.price)}</div><div class="note">Доставка: ${p.days} дн.</div></div><div class="qty"><button data-action="remove" data-id="${p.id}" aria-label="Убрать одну: ${p.name}">−</button>${q}<button data-action="add" data-id="${p.id}" ${q>=state.stock[p.id]?'disabled':''} aria-label="Добавить одну: ${p.name}">+</button></div></article>`}
  h+=cartCount()?`<button class="button wide" data-action="checkout" ${total()>state.money?'disabled':''}>Оплатить ${rub(total())}</button>${total()>state.money?'<div class="warning">Недостаточно денег.</div>':''}`:'<p class="empty">Корзина пуста.</p>';
  h+='<button class="button secondary wide" data-action="catalog">Вернуться в каталог</button></div>';
 }else if(page==='orders'){
  h=header('Посылки','ПУНКТ ВЫДАЧИ AZON')+'<div class="pad">';
  for(const o of [...state.orders].reverse()){
   const ready=o.ready<=state.day;h+=`<article class="card"><div class="icon">▣</div><div class="detail"><h3>Заказ № ${o.id}</h3><div class="note">${o.items.map(i=>`${products.find(p=>p.id===i.id).name} × ${i.qty}`).join('<br>')}</div><p class="note">${o.picked?'Получен':ready?'Готов к выдаче':'Прибудет в день '+o.ready}</p>${!o.picked&&ready?`<button class="button" data-action="pickup" data-id="${o.id}">Забрать в пункте</button>`:''}</div></article>`;
  }
  if(!state.orders.length)h+='<p class="empty">Заказов пока нет.</p>';h+='</div>';
 }else if(page==='inventory'){
  h=header('Мои детали','ПОЛУЧЕННЫЕ ЗАКАЗЫ')+'<div class="pad">';
  for(const p of products){const n=state.inventory[p.id];if(n)h+=`<article class="card"><div class="icon">${p.icon}</div><div class="detail"><h3>${p.name}</h3><div class="note">В мастерской: ${n} шт.</div></div></article>`}
  if(!Object.values(state.inventory).some(Boolean))h+='<p class="empty">Сначала забери заказ в пункте выдачи.</p>';h+='</div>';
 }else if(page==='avitu'){
  h=header('авиту','ПОИСК ДОНОРА')+`<div class="pad"><div class="info">Объявления для будущих сделок. Покупка доноров в этой демонстрации ещё не реализована.</div><article class="card"><div class="icon">▯</div><div class="detail"><h3>R / 01, не включается</h3><div class="price">900 ₽</div><div class="note">«Экран целый, просто сел. Проверить нечем».<br>★ 4,8 · 24 отзыва</div></div></article><div class="warning">У донора может оказаться рабочий дисплей — но это нужно выяснить на встрече.</div></div>`;
 }
 document.getElementById('content').innerHTML=h;
 document.getElementById('message').innerHTML=notice?'<div class="message">'+notice+'</div>':'';
 const input=document.getElementById('search');if(input){input.value=query;input.addEventListener('input',e=>{query=e.target.value;document.getElementById('products').innerHTML=products.filter(p=>p.name.toLowerCase().includes(query.toLowerCase())).map(card).join('')||'<p class="empty">Такой детали в каталоге нет.</p>'})}
 save();
}
function act(action,id){
 notice='';
 if(['home','catalog','orders','inventory','avitu','cart'].includes(action)){page=action;render();return}
 if(action==='add'){
  const p=products.find(p=>p.id===id);if(!p||(state.cart[id]||0)>=state.stock[id])return;
  state.cart[id]=(state.cart[id]||0)+1;notice='В корзине: '+p.name;
 }else if(action==='remove'){state.cart[id]=Math.max(0,(state.cart[id]||0)-1)}
 else if(action==='checkout'){
  const cost=total();if(!cartCount()||cost>state.money)return;
  const items=products.filter(p=>state.cart[p.id]).map(p=>({id:p.id,qty:state.cart[p.id]}));
  if(items.some(i=>i.qty>state.stock[i.id])){notice='Изменилось наличие деталей.';render();return}
  const days=Math.max(...items.map(i=>products.find(p=>p.id===i.id).days));
  state.money-=cost;for(const i of items)state.stock[i.id]-=i.qty;
  state.orders.push({id:state.serial++,items,ready:state.day+days,picked:false});state.cart={};page='orders';notice='Заказ оплачен. Прибудет в день '+(state.day+days)+'.';
 }else if(action==='pickup'){
  const o=state.orders.find(o=>o.id===Number(id));if(!o||o.picked||o.ready>state.day)return;
  for(const i of o.items)state.inventory[i.id]=(state.inventory[i.id]||0)+i.qty;o.picked=true;notice='Посылка получена. Детали доступны в мастерской.';
 }else if(action==='sleep'){state.day++;notice='Наступил день '+state.day+'. Проверь посылки.'}
 else if(action==='reset'){state=fresh();page='home';query='';notice='Демонстрация начата заново.'}
 render();
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.id)});
render();
</script></html>
